name: Dependabot auto-merge

# Merges a Dependabot PR only after the CI workflow has finished green on its
# head commit. Triggered by CI completing (not by the PR opening), so it never
# depends on branch-protection settings to wait for checks. Major version bumps
# are left for a human. Runs from the default branch and never checks out PR
# code, so the write token is not exposed to it.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Merge when safe
        run: |
          [ -n "$PR" ] || { echo "No PR attached to this run"; exit 0; }
          STATE=$(gh pr view "$PR" --json state --jq .state)
          AUTHOR=$(gh pr view "$PR" --json author --jq .author.login)
          TITLE=$(gh pr view "$PR" --json title --jq .title)
          SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          [ "$STATE" = OPEN ] || { echo "PR is $STATE"; exit 0; }
          [ "$AUTHOR" = "app/dependabot" ] || [ "$AUTHOR" = "dependabot[bot]" ] || { echo "Not a Dependabot PR"; exit 0; }
          [ "$SHA" = "$HEAD_SHA" ] || { echo "PR head moved since CI ran; waiting for the next CI run"; exit 0; }

          if [[ "$TITLE" =~ from\ v?([0-9]+)[^\ ]*\ to\ v?([0-9]+) ]]; then
            [ "${BASH_REMATCH[1]}" = "${BASH_REMATCH[2]}" ] || { echo "Major bump ($TITLE): needs a human"; exit 0; }
          elif [[ "$TITLE" != *"minor-and-patch"* ]]; then
            echo "Unrecognised title, leaving for a human: $TITLE"; exit 0
          fi

          gh pr merge "$PR" --squash --match-head-commit "$HEAD_SHA"
